# Deploy no Netlify (14/09/2026) — ao lado do vercel.json (plano original,
# adiado). Next.js 16 é auto-detectado pelo adaptador oficial da Netlify
# (Next.js Runtime v5, via @netlify/plugin-nextjs) sem precisar declarar o
# plugin aqui: a própria Netlify recomenda NÃO fixar a versão do adaptador
# manualmente — ela atualiza sozinha a cada build. https://docs.netlify.com/build/frameworks/framework-setup-guides/nextjs/overview/
#
# Variáveis de ambiente NÃO ficam aqui (arquivo versionado) — configure em
# Site settings > Environment variables no painel da Netlify, usando
# .env.example como lista do que precisa preencher.
[build]
  command = "npm run build"

[build.environment]
  # Next.js 16 exige Node 20.9+; sem isso a Netlify pode usar um LTS mais
  # velho por padrão.
  NODE_VERSION = "20"
  # Achado real (14/09/2026): o scanner de segredos da Netlify falha o build
  # inteiro se o valor de QUALQUER variável configurada aparece em algum
  # arquivo do repo ou do output do build. Pras variáveis NEXT_PUBLIC_* isso
  # é sempre falso positivo — elas são feitas pra virar texto público no
  # bundle do navegador (é o que o prefixo NEXT_PUBLIC_ do Next.js
  # significa), então aparecer no output de `.next` é o comportamento
  # correto, não um vazamento. Sem isso, um deploy quebra sempre que uma
  # dessas chaves aparecer em qualquer lugar do build (já aconteceu com um
  # trecho do CLAUDE.md).
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_GOOGLE_MAPS_API_KEY,NEXT_PUBLIC_TILES_URL,NEXT_PUBLIC_TILES_ATRIBUICAO"
